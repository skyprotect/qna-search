<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Tra Cứu Câu Hỏi & Đáp Án Trắc Nghiệm</title>

  <!-- Favicon SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

  <!-- Fuse.js: ưu tiên nạp file offline nội bộ, fallback CDN nếu thiếu -->
  <script src="fuse.min.js"></script>
  <script>
    if (typeof Fuse === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"><\/script>');
    }
  </script>

  <!-- Dữ liệu câu hỏi: nạp trực tiếp qua data.js để chạy offline hoàn hảo, không bị chặn CORS browser -->
  <script src="data.js"></script>

  <style>
    :root {
      --bg: #f6f8fb;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --ans-bg: #ecfdf5;
      --ans-border: #a7f3d0;
      --ans-text: #065f46;
      --ans-key-bg: #10b981;
      --ans-key-text: #ffffff;
      --highlight: #fef08a;
      --highlight-text: #713f12;
      --shadow: 0 4px 18px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 10px 24px -3px rgba(0, 0, 0, 0.08), 0 4px 8px -2px rgba(0, 0, 0, 0.04);
      --badge-bg: #f1f5f9;
      --badge-text: #475569;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: rgba(59, 130, 246, 0.15);
      --ans-bg: rgba(6, 78, 59, 0.35);
      --ans-border: #059669;
      --ans-text: #a7f3d0;
      --ans-key-bg: #10b981;
      --ans-key-text: #ffffff;
      --highlight: #854d0e;
      --highlight-text: #fef08a;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 10px 25px -3px rgba(0, 0, 0, 0.5);
      --badge-bg: #334155;
      --badge-text: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.55;
      padding: 24px 16px 60px;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      position: relative;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      margin-top: 4px;
    }

    .description {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 8px;
    }

    .theme-toggle-btn {
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: scale(1.05);
    }

    /* Toolbar & Quick filters */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 12.5px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .chip:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .options-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
      user-select: none;
    }

    .options-toggle-label input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Sticky Search Area */
    .search-section {
      position: sticky;
      top: 14px;
      z-index: 100;
      margin-bottom: 16px;
    }

    .search-wrap {
      position: relative;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.12);
      border: 1.5px solid var(--border-color);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 10px 28px -4px rgba(37, 99, 235, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    #search {
      width: 100%;
      padding: 14px 44px 14px 42px;
      font-size: 16px;
      background: transparent;
      color: var(--text-main);
      border: none;
      outline: none;
      border-radius: 12px;
    }

    #search::placeholder {
      color: var(--text-sub);
      opacity: 0.8;
    }

    /* Clear Button */
    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      background: var(--badge-bg);
      color: var(--text-sub);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .clear-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
      font-size: 13.5px;
      color: var(--text-sub);
    }

    .shortcut-hint {
      font-size: 12px;
      opacity: 0.85;
    }

    .shortcut-hint kbd {
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      font-family: inherit;
      color: var(--badge-text);
    }

    /* Results List */
    #results {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      position: relative;
    }

    .result-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-hover);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .q-badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .q-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .q-prefix {
      color: var(--primary);
      font-weight: 700;
      margin-right: 4px;
    }

    /* Answer box */
    .ans-box {
      background: var(--ans-bg);
      border: 1px solid var(--ans-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: background-color 0.2s;
    }

    .ans-tag {
      flex-shrink: 0;
      background: var(--ans-key-bg);
      color: var(--ans-key-text);
      font-size: 14px;
      font-weight: 700;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .ans-content {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--ans-text);
      line-height: 1.5;
    }

    .ans-content-label {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      opacity: 0.85;
      display: block;
      margin-bottom: 2px;
    }

    /* Options Accordion */
    .options-container {
      margin-top: 12px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }

    .options-toggle-btn {
      font-size: 12.5px;
      color: var(--text-sub);
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .options-toggle-btn:hover {
      color: var(--primary);
    }

    .options-list {
      margin-top: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .options-list.show {
      display: flex;
    }

    .option-item {
      font-size: 13.5px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--badge-bg);
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid transparent;
      line-height: 1.45;
    }

    .option-item.is-correct {
      background: var(--ans-bg);
      border-color: var(--ans-border);
      color: var(--ans-text);
      font-weight: 600;
    }

    .opt-key {
      font-weight: 700;
      min-width: 18px;
    }

    /* Highlight mark */
    mark.highlight {
      background: var(--highlight);
      color: var(--highlight-text);
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 700;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Scroll to top button */
    .scroll-top-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 90;
      transition: transform 0.2s, background-color 0.2s;
    }

    .scroll-top-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Empty state */
    .empty-state {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      body {
        padding: 14px 10px 50px;
      }
      .header {
        padding: 16px;
      }
      .title-group h1 {
        font-size: 20px;
      }
      .result-card {
        padding: 14px;
      }
      .q-text {
        font-size: 15px;
      }
      .ans-content {
        font-size: 14px;
      }
      .search-section {
        top: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="title-group">
          <h1>
            <span>Tra Cứu Câu Hỏi & Đáp Án</span>
          </h1>
          <p class="description">Gõ từ khóa, số thứ tự câu hỏi (VD: 15, câu 180) hoặc nội dung bất kỳ để tra cứu nhanh.</p>
        </div>
        <button id="themeToggle" class="theme-toggle-btn" title="Chuyển chế độ Sáng / Tối" aria-label="Toggle Theme">
          <span id="themeIcon">🌙</span>
        </button>
      </div>

      <!-- Quick filters & Settings -->
      <div class="toolbar">
        <div class="filter-chips">
          <button class="chip active" data-filter="all">Tất cả (180)</button>
          <button class="chip" data-filter="top10">Top 10</button>
          <button class="chip" data-filter="1-50">Câu 1-50</button>
          <button class="chip" data-filter="51-100">Câu 51-100</button>
          <button class="chip" data-filter="101-150">Câu 101-150</button>
          <button class="chip" data-filter="151-180">Câu 151-180</button>
        </div>

        <label class="options-toggle-label" title="Hiện danh sách các lựa chọn A, B, C, D của câu hỏi">
          <input type="checkbox" id="alwaysShowOptionsToggle" />
          <span>Hiện đủ lựa chọn A-B-C-D</span>
        </label>
      </div>
    </header>

    <!-- Search Section (Sticky) -->
    <div class="search-section">
      <div class="search-wrap">
        <div class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input id="search" type="text" placeholder="Nhập từ khóa tìm kiếm (VD: Đại hội XIV, 2026, câu 15, quy định 144)..." autofocus autocomplete="off" />
        <div id="clearBtn" class="clear-btn" title="Xóa tìm kiếm">×</div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div id="count">Đang tải dữ liệu...</div>
      <div class="shortcut-hint">Phím tắt: <kbd>/</kbd> để tìm, <kbd>Esc</kbd> để xóa</div>
    </div>

    <!-- Results Container -->
    <main id="results"></main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg">Đã sao chép vào bộ nhớ tạm!</span>
  </div>

  <!-- Scroll To Top Button -->
  <button id="scrollTopBtn" class="scroll-top-btn" title="Lên đầu trang">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

<script>
(function() {
  let allData = [];
  let fuse = null;
  let currentFilter = 'all';
  let alwaysShowOptions = false;
  let activeSearchQuery = '';

  const input = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const resultsEl = document.getElementById('results');
  const countEl = document.getElementById('count');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const scrollTopBtn = document.getElementById('scrollTopBtn');
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const chips = document.querySelectorAll('.chip');
  const alwaysShowOptionsToggle = document.getElementById('alwaysShowOptionsToggle');

  // Fuse.js options
  const fuseOptions = {
    includeScore: true,
    threshold: 0.35,
    minMatchCharLength: 2,
    keys: [
      { name: 'q', weight: 0.45 },
      { name: 'q_norm', weight: 0.35 },
      { name: 'a', weight: 0.25 },
      { name: 'a_norm', weight: 0.15 }
    ]
  };

  // Helper xóa dấu tiếng Việt
  function removeVietnameseTones(str) {
    if (!str) return '';
    return str
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd')
      .replace(/Đ/g, 'D')
      .toLowerCase();
  }

  // Regex tạo pattern tìm kiếm tiếng Việt không dấu cho highlight
  function makeViRegex(keyword) {
    const map = {
      'a': '[aàáạảãâầấậẩẫăằắặẳẵAÀÁẠẢÃÂẦẤẬẨẪĂẰẮẶẲẴ]',
      'e': '[eèéẹẻẽêềếệểễEÈÉẸẺẼÊỀẾỆỂỄ]',
      'i': '[iìíịỉĩIÌÍỊỈĨ]',
      'o': '[oòóọỏõôồốộổỗơờớợởỡOÒÓỌỎÕÔỒỐỘỔỖƠỜỚỢỞỠ]',
      'u': '[uùúụủũưừứựửữUÙÚỤỦŨƯỪỨỰỬỮ]',
      'y': '[yỳýỵỷỹYỲÝỴỶỸ]',
      'd': '[dđDĐ]'
    };
    let pattern = '';
    for (const c of keyword.toLowerCase()) {
      if (map[c]) pattern += map[c];
      else if (/[0-9a-z]/i.test(c)) pattern += c;
      else if (/\s/.test(c)) pattern += '\\s+';
      else pattern += '\\' + c;
    }
    return pattern;
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c]);
  }

  // Highlight từ khóa
  function highlightText(rawText, query) {
    const escaped = escapeHtml(rawText);
    if (!query || !query.trim()) return escaped;

    const terms = query.trim().split(/\s+/).filter(t => t.length >= 2);
    if (!terms.length) return escaped;

    terms.sort((a, b) => b.length - a.length);
    const patterns = terms.map(t => makeViRegex(t)).filter(Boolean);
    if (!patterns.length) return escaped;

    try {
      const regex = new RegExp(`(${patterns.join('|')})`, 'gi');
      return escaped.replace(regex, '<mark class="highlight">$1</mark>');
    } catch (e) {
      return escaped;
    }
  }

  // Toast
  let toastTimer = null;
  function showToast(message) {
    toastMsg.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  // Sao chép text vào clipboard
  window.copyText = function(text, event) {
    if (event) event.stopPropagation();
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Đã chép: ' + (text.length > 35 ? text.substring(0, 35) + '...' : text));
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  };

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('Đã sao chép vào bộ nhớ tạm!');
    } catch (err) {
      showToast('Không thể tự động sao chép!');
    }
    document.body.removeChild(ta);
  }

  // Sao chép cả câu hỏi và đáp án
  window.copyFullQA = function(id, event) {
    if (event) event.stopPropagation();
    const item = allData.find(d => d.id === id);
    if (!item) return;
    const textToCopy = `Câu ${item.id}: ${item.q}\nĐáp án: ${item.a}`;
    window.copyText(textToCopy);
  };

  // Toggle danh sách lựa chọn của từng thẻ
  window.toggleOptions = function(btn) {
    const list = btn.parentElement.querySelector('.options-list');
    if (!list) return;
    const isOpen = list.classList.toggle('show');
    btn.innerHTML = isOpen ? '▼ Thu gọn các đáp án' : '▶ Xem tất cả các đáp án';
  };

  // Render danh sách kết quả
  function renderResults(list, query = '') {
    resultsEl.innerHTML = '';

    if (!list || !list.length) {
      countEl.textContent = '0 kết quả';
      resultsEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h3>Không tìm thấy câu hỏi phù hợp</h3>
          <p style="margin-top: 6px;">Thử nhập từ khóa khác, số thứ tự câu hỏi hoặc xóa ô tìm kiếm.</p>
        </div>
      `;
      return;
    }

    countEl.textContent = `${list.length} kết quả` + (allData.length ? ` (trên tổng số ${allData.length} câu)` : '');

    const frag = document.createDocumentFragment();

    for (const item of list) {
      const card = document.createElement('article');
      card.className = 'result-card';
      card.id = `q-${item.id}`;

      const highlightedQ = highlightText(item.q, query);
      const highlightedA = highlightText(item.a, query);

      // Render các đáp án nếu có
      let optionsHtml = '';
      if (item.options && item.options.length) {
        const showClass = alwaysShowOptions ? 'show' : '';
        const btnText = alwaysShowOptions ? '▼ Thu gọn các đáp án' : '▶ Xem tất cả các đáp án';
        
        const optsItems = item.options.map(opt => {
          const isCorrect = opt.correct;
          const optText = highlightText(opt.text, query);
          return `
            <div class="option-item ${isCorrect ? 'is-correct' : ''}">
              <span class="opt-key">${escapeHtml(opt.key)}.</span>
              <span class="opt-text">${optText} ${isCorrect ? ' <b style="color:var(--ans-key-bg);margin-left:4px;">(✓ Đáp án đúng)</b>' : ''}</span>
            </div>
          `;
        }).join('');

        optionsHtml = `
          <div class="options-container">
            <button class="options-toggle-btn" onclick="toggleOptions(this)">${btnText}</button>
            <div class="options-list ${showClass}">
              ${optsItems}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="card-top">
          <span class="q-badge">CÂU ${item.id}</span>
          <div class="card-actions">
            <button class="copy-btn" onclick="copyFullQA(${item.id}, event)" title="Sao chép toàn bộ Câu hỏi và Đáp án">
              📋 Sao chép Q&A
            </button>
          </div>
        </div>

        <div class="q-text">
          <span class="q-prefix">Q:</span> ${highlightedQ}
        </div>

        <div class="ans-box">
          <div class="ans-tag">${escapeHtml(item.ans_key || '✓')}</div>
          <div class="ans-content">
            <span class="ans-content-label">Đáp án chính xác:</span>
            ${highlightedA}
          </div>
          <button class="copy-btn" onclick="copyText('${escapeHtml(item.a).replace(/'/g, "\\'")}', event)" title="Sao chép riêng đáp án này" style="align-self: flex-start; margin-top: 2px;">
            Sao chép
          </button>
        </div>

        ${optionsHtml}
      `;

      frag.appendChild(card);
    }

    resultsEl.appendChild(frag);
  }

  // Thuật toán tìm kiếm thông minh: ID exact + Phrase match + Multi-token + Fuse fallback
  function smartSearch(query) {
    const raw = query.trim();
    if (!raw) return allData;

    const rawLower = raw.toLowerCase();
    const rawNorm = removeVietnameseTones(raw);

    // 1. Kiểm tra trực tiếp số thứ tự câu hỏi: "15", "câu 15", "c15"
    const numMatch = raw.match(/^(?:câu\s*|c\s*)?(\d+)$/i);
    let idItem = null;
    if (numMatch) {
      const idVal = parseInt(numMatch[1], 10);
      idItem = allData.find(d => d.id === idVal);
      if (idItem && (rawNorm === String(idVal) || rawNorm === `cau ${idVal}` || rawNorm === `c${idVal}`)) {
        return [idItem];
      }
    }

    const normWords = rawNorm.split(/\s+/).filter(w => w.length > 0);

    // Mở rộng chữ số La Mã thông dụng trong các kỳ Đại hội (14 <-> xiv, 13 <-> xiii)
    const normWordsExpanded = normWords.map(w => {
      if (w === '14') return ['14', 'xiv'];
      if (w === 'xiv') return ['xiv', '14'];
      if (w === '13') return ['13', 'xiii'];
      if (w === 'xiii') return ['xiii', '13'];
      return [w];
    });

    const fullTokenMatches = [];
    const partialMatches = [];

    for (const item of allData) {
      if (idItem && item.id === idItem.id) {
        fullTokenMatches.push({ item, score: 99999 });
        continue;
      }

      const qLower = item.q.toLowerCase();
      const aLower = item.a.toLowerCase();
      const qNorm = item.q_norm;
      const aNorm = item.a_norm;

      // Điểm khớp nguyên cụm
      let phraseScore = 0;
      if (qLower.includes(rawLower)) phraseScore += 1000;
      else if (qNorm.includes(rawNorm)) phraseScore += 800;
      else if (aLower.includes(rawLower)) phraseScore += 600;
      else if (aNorm.includes(rawNorm)) phraseScore += 400;

      let matchedTokens = 0;
      let qMatchedTokens = 0;

      for (let i = 0; i < normWordsExpanded.length; i++) {
        const variants = normWordsExpanded[i];
        let foundInQ = false;
        let foundInA = false;

        for (const v of variants) {
          if (qNorm.includes(v)) {
            foundInQ = true;
            break;
          }
        }
        for (const v of variants) {
          if (aNorm.includes(v)) {
            foundInA = true;
            break;
          }
        }

        if (foundInQ) qMatchedTokens++;
        if (foundInQ || foundInA) matchedTokens++;
      }

      if (matchedTokens === normWords.length) {
        // Khớp toàn bộ các từ trong từ khóa!
        const totalScore = phraseScore + 500 + (qMatchedTokens * 50);
        fullTokenMatches.push({ item, score: totalScore });
      } else if (normWords.length > 1 && matchedTokens >= Math.max(2, normWords.length - 1)) {
        // Khớp một phần lớn từ khóa
        const totalScore = phraseScore + (matchedTokens * 40) + (qMatchedTokens * 20);
        partialMatches.push({ item, score: totalScore });
      } else if (normWords.length === 1 && matchedTokens === 1) {
        const totalScore = phraseScore + (qMatchedTokens * 30);
        fullTokenMatches.push({ item, score: totalScore });
      }
    }

    fullTokenMatches.sort((a, b) => b.score - a.score);
    partialMatches.sort((a, b) => b.score - a.score);

    let combined = [];
    if (fullTokenMatches.length > 0) {
      combined = fullTokenMatches.map(m => m.item);
      if (combined.length < 5 && partialMatches.length > 0) {
        combined.push(...partialMatches.slice(0, 5 - combined.length).map(m => m.item));
      }
    } else if (partialMatches.length > 0) {
      combined = partialMatches.map(m => m.item);
    }

    // Nếu vẫn không có kết quả, dùng Fuse fuzzy tìm kiếm gần đúng
    if (combined.length === 0 && fuse && rawNorm.length >= 2) {
      const fuseRes = fuse.search(raw);
      combined = fuseRes.map(r => r.item);
    }

    return combined;
  }

  function performSearch(query) {
    activeSearchQuery = query.trim();
    if (!activeSearchQuery) {
      applyCurrentFilter();
      return;
    }
    const results = smartSearch(activeSearchQuery);
    renderResults(results, activeSearchQuery);
  }

  // Áp dụng bộ lọc nhanh khi không có từ khóa tìm kiếm
  function applyCurrentFilter() {
    let list = [];
    switch (currentFilter) {
      case 'top10':
        list = allData.slice(0, 10);
        break;
      case '1-50':
        list = allData.filter(d => d.id >= 1 && d.id <= 50);
        break;
      case '51-100':
        list = allData.filter(d => d.id >= 51 && d.id <= 100);
        break;
      case '101-150':
        list = allData.filter(d => d.id >= 101 && d.id <= 150);
        break;
      case '151-180':
        list = allData.filter(d => d.id >= 151 && d.id <= 180);
        break;
      case 'all':
      default:
        list = allData;
        break;
    }
    renderResults(list);
  }

  // Nạp dữ liệu
  function initData(data) {
    allData = data.map(item => ({
      ...item,
      id_str: `câu ${item.id} ${item.id}`
    }));

    if (typeof Fuse !== 'undefined') {
      fuse = new Fuse(allData, fuseOptions);
    }

    renderResults(allData);
  }

  // Tải dữ liệu: Ưu tiên window.QUESTIONS_DATA từ data.js, fallback fetch data.json
  function loadQuestions() {
    if (window.QUESTIONS_DATA && Array.isArray(window.QUESTIONS_DATA)) {
      initData(window.QUESTIONS_DATA);
    } else {
      fetch('data.json')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(json => {
          initData(json);
        })
        .catch(err => {
          console.error('Không thể nạp data.json:', err);
          countEl.textContent = 'Lỗi nạp dữ liệu';
          resultsEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <h3>Không thể tải file dữ liệu câu hỏi</h3>
              <p style="margin-top: 8px;">Vui lòng kiểm tra file <code>data.js</code> hoặc <code>data.json</code> cùng thư mục.</p>
            </div>
          `;
        });
    }
  }

  // Sự kiện ô nhập tìm kiếm
  input.addEventListener('input', () => {
    const val = input.value;
    clearBtn.style.display = val.length > 0 ? 'flex' : 'none';
    performSearch(val);
  });

  // Nút xóa tìm kiếm
  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.style.display = 'none';
    input.focus();
    performSearch('');
  });

  // Filter chips click
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.getAttribute('data-filter');
      
      // Nếu đang có từ khóa thì xóa để hiện filter
      if (input.value) {
        input.value = '';
        clearBtn.style.display = 'none';
      }
      applyCurrentFilter();
    });
  });

  // Toggle "Hiện đủ lựa chọn A-B-C-D"
  alwaysShowOptionsToggle.addEventListener('change', (e) => {
    alwaysShowOptions = e.target.checked;
    const lists = document.querySelectorAll('.options-list');
    const btns = document.querySelectorAll('.options-toggle-btn');
    lists.forEach(l => {
      if (alwaysShowOptions) l.classList.add('show');
      else l.classList.remove('show');
    });
    btns.forEach(b => {
      b.innerHTML = alwaysShowOptions ? '▼ Thu gọn các đáp án' : '▶ Xem tất cả các đáp án';
    });
  });

  // Phím tắt bàn phím
  window.addEventListener('keydown', (e) => {
    if ((e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
      input.select();
    }
    if (e.key === 'Escape' && input.value) {
      input.value = '';
      clearBtn.style.display = 'none';
      performSearch('');
    }
  });

  // Scroll to top
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      scrollTopBtn.style.display = 'flex';
    } else {
      scrollTopBtn.style.display = 'none';
    }
  });

  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    input.focus();
  });

  // Dark mode
  const currentTheme = localStorage.getItem('theme') || 
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeIcon.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', t);
  }

  setTheme(currentTheme);

  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    setTheme(isDark ? 'light' : 'dark');
  });

  // Khởi động
  loadQuestions();
})();
</script>

</body>
</html>
